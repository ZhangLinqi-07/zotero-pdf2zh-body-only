name: Portable patch tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_note_format.js
      - run: node tests/test_reading_bridge.js
      - run: node tests/test_paper_chat_ui.js
      - run: node tests/test_reading_backend_ui.js
      - run: node tests/test_backend_update.js
      - run: python tests/integration_backend_update.py
