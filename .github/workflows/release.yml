name: Publish paired Zotero release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_note_format.js && node tests/test_reading_bridge.js && node tests/test_paper_chat_ui.js && node tests/test_reading_backend_ui.js && node tests/test_backend_update.js
      - run: python tests/integration_backend_update.py
      - name: Build pinned public assets
        run: python scripts/build_release.py --tag "$GITHUB_REF_NAME"
      - name: Upload, verify and publish assets before switching the channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          folder="dist/$tag"
          gh release create "$tag" --draft --title "Kinbo $tag" --notes-file docs/release-notes.md
          gh release upload "$tag" "$folder"/*.xpi "$folder"/*.zip "$folder/SHA256SUMS.txt"
          mkdir "$folder/verify"
          gh release download "$tag" --dir "$folder/verify"
          (cd "$folder/verify" && sha256sum --check SHA256SUMS.txt)
          gh release edit "$tag" --draft=false --latest
          git fetch origin main
          git checkout -B publish-channel origin/main
          python -c 'from install import VERSION; import os; assert "v" + VERSION == os.environ["GITHUB_REF_NAME"], "main has advanced to another release"'
          cp "$folder/updates.json" updates.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add updates.json
          git diff --cached --quiet || git commit -m "Publish verified $tag Zotero update channel"
          git push origin HEAD:main
